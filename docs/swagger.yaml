basePath: /api/v1
definitions:
  model.WorkflowStatus:
    enum:
    - pending
    - in_progress
    - completed
    - unset
    type: string
    x-enum-varnames:
    - WorkflowPending
    - WorkflowInProgress
    - WorkflowCompleted
    - WorkflowUnset
  value.ChapterDetail:
    properties:
      chapter_no:
        type: string
      comic_id:
        type: string
      cover_url:
        type: string
      created_at:
        type: integer
      creator_id:
        type: string
      id:
        type: string
      index:
        type: integer
      page_count:
        type: integer
      proofread_at:
        type: integer
      proofread_unit_count:
        type: integer
      proofreading_at:
        type: integer
      published_at:
        type: integer
      reviewed_at:
        type: integer
      total_unit_count:
        type: integer
      transalating_at:
        type: integer
      translated_at:
        type: integer
      translated_unit_count:
        type: integer
      typeset_at:
        type: integer
      typesetting_at:
        type: integer
      updated_at:
        type: integer
      uploaded_at:
        type: integer
    type: object
  value.ComicInfo:
    properties:
      author:
        type: string
      chapter_count:
        type: integer
      coverUrl:
        type: string
      created_at:
        type: integer
      creator_id:
        type: string
      description:
        type: string
      id:
        type: string
      index:
        type: integer
      last_active_at:
        type: integer
      title:
        type: string
      updated_at:
        type: integer
    type: object
  value.CreateChapterArgs:
    properties:
      chapter_no:
        type: string
      comic_id:
        type: string
    type: object
  value.CreateChapterResult:
    properties:
      id:
        type: string
    type: object
  value.CreateComicArgs:
    properties:
      author:
        type: string
      description:
        type: string
      team_id:
        type: string
      title:
        type: string
    type: object
  value.CreateComicResult:
    properties:
      id:
        type: string
    type: object
  value.CreateInvitationArgs:
    properties:
      invitee_qq:
        type: string
      roles:
        type: integer
      team_id:
        type: string
    type: object
  value.CreateMemberArgs:
    properties:
      roles:
        type: integer
      team_id:
        type: string
      user_id:
        type: string
    type: object
  value.CreateMemberResult:
    properties:
      member_id:
        type: string
    type: object
  value.CreateTeamArgs:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  value.InvitationInfo:
    properties:
      created_at:
        type: integer
      id:
        type: string
      invitation_code:
        type: string
      invitee_qq:
        type: string
      invitor_id:
        type: string
      pending:
        type: boolean
      roles:
        type: integer
    type: object
  value.JoinTeamArgs:
    properties:
      invitation_code:
        type: string
    type: object
  value.LoginUserArgs:
    properties:
      password:
        type: string
      qq:
        type: string
    type: object
  value.LoginUserResult:
    properties:
      access_token:
        type: string
      user_id:
        type: string
    type: object
  value.MemberProfile:
    properties:
      avatar_oss_key:
        type: string
      created_at:
        type: integer
      id:
        type: string
      is_avatar_uploaded:
        type: boolean
      name:
        type: string
      qq:
        type: string
      roles:
        type: integer
      updated_at:
        type: integer
    type: object
  value.PageCreationResult:
    properties:
      page_id:
        type: string
      put_url:
        type: string
    type: object
  value.PageInfo:
    properties:
      chapter_id:
        type: string
      created_at:
        type: integer
      id:
        type: string
      index:
        type: integer
      proofread_unit_count:
        type: integer
      total_unit_count:
        type: integer
      translated_unit_count:
        type: integer
      updated_at:
        type: integer
    type: object
  value.RegisterUserArgs:
    properties:
      invitation_code:
        type: string
      name:
        type: string
      password:
        type: string
      qq:
        type: string
    type: object
  value.RegisterUserResult:
    properties:
      access_token:
        type: string
      user_id:
        type: string
    type: object
  value.ReserveChapterPagesArgs:
    properties:
      chapter_id:
        type: string
      page_count:
        type: integer
    type: object
  value.ReserveChapterPagesResult:
    properties:
      creations:
        items:
          $ref: '#/definitions/value.PageCreationResult'
        type: array
    type: object
  value.ReserveTeamAvatarResult:
    properties:
      avatar_oss_key:
        type: string
      put_url:
        type: string
    type: object
  value.ReserveUserAvatarResult:
    properties:
      avatar_oss_key:
        type: string
      put_url:
        type: string
    type: object
  value.TeamInfo:
    properties:
      avatar_oss_key:
        type: string
      created_at:
        type: integer
      description:
        type: string
      id:
        type: string
      is_avatar_uploaded:
        type: boolean
      name:
        type: string
      updated_at:
        type: integer
    type: object
  value.UpdateChapterArgs:
    properties:
      chapter_id:
        type: string
      chapter_no:
        description: ChapterNo 章节编号，最多 10 字符；不传则不更新
        type: string
      proofread_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: ProofreadStatus 校对状态，可取值：pending（待校对）、in_progress（校对中）、completed（已校对）；不传则不更新
      publish_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: PublishStatus 发布状态，可取值：pending（待发布）、completed（已发布）；不传则不更新
      review_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: ReviewStatus 审阅状态，可取值：pending（待审阅）、completed（已审阅）；不传则不更新
      translate_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: TranslateStatus 翻译状态，可取值：pending（待翻译）、in_progress（翻译中）、completed（已翻译）；不传则不更新
      typeset_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: TypesetStatus 排版状态，可取值：pending（待排版）、in_progress（排版中）、completed（已排版）；不传则不更新
      upload_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: UploadStatus 上传状态，可取值：pending（待上传）、completed（已上传）；不传则不更新
    type: object
  value.UpdateComicArgs:
    properties:
      author:
        type: string
      description:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  value.UpdateInvitationArgs:
    properties:
      id:
        type: string
      roles:
        type: integer
      team_id:
        type: string
    type: object
  value.UpdateMemberRoleArgs:
    properties:
      id:
        type: string
      roles:
        type: integer
    type: object
  value.UpdatePageArgs:
    properties:
      id:
        type: string
      is_uploaded:
        description: |-
          由于采用预签名方式让客户端上传，所以在客户端上传后，
          必须让其主动调用一次更新接口来告诉后端该页面已经上传完成了
        type: boolean
    type: object
  value.UpdateTeamArgs:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  value.UpdateUserArgs:
    properties:
      name:
        type: string
      password:
        type: string
      qq:
        type: string
      user_id:
        type: string
    type: object
  value.UserInfo:
    properties:
      avatar_oss_key:
        type: string
      created_at:
        type: integer
      id:
        type: string
      is_avatar_uploaded:
        type: boolean
      name:
        type: string
      qq:
        type: string
      updated_at:
        type: integer
    type: object
info:
  contact: {}
  description: LabelPlus Next Web 后端 API 文档
  title: LabelPlus Next Web API
  version: 0.1.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用 QQ 和密码进行登录，成功返回访问令牌
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.LoginUserArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/value.LoginUserResult'
      summary: 用户登录（已测试）
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 使用 QQ、密码、名字和邀请码进行注册，成功返回访问令牌
      parameters:
      - description: 注册参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.RegisterUserArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/value.RegisterUserResult'
      summary: 用户注册（已测试）
      tags:
      - auth
  /chapters:
    get:
      description: 获取指定漫画的章节列表，支持分页，注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 漫画 ID
        in: query
        name: comic_id
        required: true
        type: string
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/value.ChapterDetail'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取漫画章节列表
      tags:
      - chapter
    post:
      consumes:
      - application/json
      description: 在指定漫画中创建章节
      parameters:
      - description: 创建章节参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.CreateChapterArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/value.CreateChapterResult'
      security:
      - ApiKeyAuth: []
      summary: 创建漫画章节
      tags:
      - chapter
  /chapters/{chapter_id}:
    delete:
      description: 删除指定章节
      parameters:
      - description: 章节 ID
        in: path
        name: chapter_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除章节
      tags:
      - chapter
    patch:
      consumes:
      - application/json
      description: 局部更新指定章节的信息，未传的字段不会被修改
      parameters:
      - description: 章节 ID
        in: path
        name: chapter_id
        required: true
        type: string
      - description: 更新章节参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.UpdateChapterArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新章节（PATCH 语义，仅传需要更新的字段）
      tags:
      - chapter
  /comics:
    get:
      description: 获取指定汉化组的漫画列表，支持分页，注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 汉化组 ID
        in: query
        name: team_id
        required: true
        type: string
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/value.ComicInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取指定汉化组的漫画列表（已测试）
      tags:
      - comic
    post:
      consumes:
      - application/json
      description: 在指定汉化组中创建漫画
      parameters:
      - description: 创建漫画参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.CreateComicArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/value.CreateComicResult'
      security:
      - ApiKeyAuth: []
      summary: 创建漫画（已测试）
      tags:
      - comic
  /comics/{comic_id}:
    delete:
      description: 删除指定漫画
      parameters:
      - description: 漫画 ID
        in: path
        name: comic_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除漫画（已测试）
      tags:
      - comic
    put:
      consumes:
      - application/json
      description: 更新指定漫画的信息
      parameters:
      - description: 漫画 ID
        in: path
        name: comic_id
        required: true
        type: string
      - description: 更新漫画参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.UpdateComicArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新漫画（已测试）
      tags:
      - comic
  /invitations:
    get:
      description: 获取指定汉化组的邀请列表，注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 汉化组 ID
        in: query
        name: team_id
        required: true
        type: string
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/value.InvitationInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取邀请列表（已测试）
      tags:
      - invitation
    post:
      consumes:
      - application/json
      description: 在指定汉化组中创建一个新的邀请
      parameters:
      - description: 创建邀请参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.CreateInvitationArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/value.InvitationInfo'
      security:
      - ApiKeyAuth: []
      summary: 创建邀请（已测试）
      tags:
      - invitation
  /invitations/{invitation_id}:
    delete:
      description: 删除指定的邀请
      parameters:
      - description: 邀请 ID
        in: path
        name: invitation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除邀请
      tags:
      - invitation
    put:
      consumes:
      - application/json
      description: 更新指定待处理邀请的信息，无法更新已被使用或已失效的邀请
      parameters:
      - description: 邀请 ID
        in: path
        name: invitation_id
        required: true
        type: string
      - description: 更新邀请参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.UpdateInvitationArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新未被使用的邀请
      tags:
      - invitation
  /members:
    get:
      description: 获取指定汉化组的成员列表，注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 汉化组 ID
        in: query
        name: team_id
        required: true
        type: string
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/value.MemberProfile'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取指定汉化组的成员列表（已测试）
      tags:
      - member
    post:
      consumes:
      - application/json
      description: 由超级管理员直接创建成员记录
      parameters:
      - description: 创建成员参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.CreateMemberArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/value.CreateMemberResult'
      security:
      - ApiKeyAuth: []
      summary: 创建成员（已测试）
      tags:
      - member
  /members/{member_id}:
    delete:
      description: 从汉化组中移除指定成员
      parameters:
      - description: 成员 ID
        in: path
        name: member_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 移除成员
      tags:
      - member
    put:
      consumes:
      - application/json
      description: 更新指定成员的分工角色
      parameters:
      - description: 成员 ID
        in: path
        name: member_id
        required: true
        type: string
      - description: 更新成员角色参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.UpdateMemberRoleArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新成员角色
      tags:
      - member
  /members/join:
    post:
      consumes:
      - application/json
      description: 已登录用户使用邀请码加入对应汉化组
      parameters:
      - description: 加入勇化组参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.JoinTeamArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 通过邀请码加入汉化组
      tags:
      - member
  /pages:
    get:
      description: 获取指定章节的所有页面，注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 章节 ID
        in: query
        name: chapter_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/value.PageInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取章节页面列表
      tags:
      - page
    post:
      consumes:
      - application/json
      description: 为指定章节批量创建页面，返回每个页面的预签名上传地址
      parameters:
      - description: 预留页面参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.ReserveChapterPagesArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/value.ReserveChapterPagesResult'
      security:
      - ApiKeyAuth: []
      summary: 预留页面记录，并生成每个页面的预签名上传地址
      tags:
      - page
  /pages/{chapter_id}:
    delete:
      description: 删除指定章节的所有页面
      parameters:
      - description: 章节 ID
        in: path
        name: chapter_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除章节所有页面
      tags:
      - page
  /pages/{page_id}:
    put:
      consumes:
      - application/json
      description: 更新指定页面的信息，例如标记页面已上传完成
      parameters:
      - description: 页面 ID
        in: path
        name: page_id
        required: true
        type: string
      - description: 更新页面参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.UpdatePageArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新页面
      tags:
      - page
  /teams:
    get:
      description: 获取所有汉化组列表，仅超级管理员有权限，注意当列表为空，会返回 null 而不是空数组
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/value.TeamInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取所有汉化组列表（已测试）
      tags:
      - team
    post:
      consumes:
      - application/json
      description: 创建一个新的汉化组，仅超级管理员有权限
      parameters:
      - description: 创建汉化组参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.CreateTeamArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/value.TeamInfo'
      security:
