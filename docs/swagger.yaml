      - assignment-invitation
  /api/v1/assignment-invitations/join:
    post:
      consumes:
      - application/json
      description: |-
        Join chapter collaboration by assignment invitation code
        Auth: `authorization` cookie is preferred over `Authorization` header when both are present
      parameters:
      - description: join args
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.JoinAssignmentInvArgs'
      produces:
