          schema:
            $ref: '#/definitions/res.HttpRes-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/res.HttpRes-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.HttpRes-any'
      security:
      - ApiKeyAuth: []
      summary: Save Page Units
      tags:
      - unit
