info:
  contact: {}
  description: Poprako-S refactor API documentation
  title: Poprako-S Refactor API
  version: 0.4.0
paths:
  /api/v1/assignment-invitations:
    get:
      description: |-
        List assignment invitations for one chapter
        The caller must be reviewer of the target chapter
        Auth: `authorization` cookie is preferred over `Authorization` header when both are present
      parameters:
      - description: chapter id
        in: query
        name: chapter_id
        required: true
        type: string
      - description: pending filter
        in: query
        name: pending
        type: boolean
      - description: pagination offset
        in: query
        name: offset
        type: integer
      - description: pagination limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.HttpRes-array_val_AssignmentInvVal'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.HttpRes-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.HttpRes-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.HttpRes-any'
      security:
      - ApiKeyAuth: []
      summary: List Assignment Invitations
      tags:
      - assignment-invitation
    post:
      consumes:
      - application/json
      description: |-
        Create assignment invitation for one chapter
        The caller must be reviewer of the target chapter
        Auth: `authorization` cookie is preferred over `Authorization` header when both are present
      parameters:
      - description: create assignment invitation args
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.CreateAssignmentInvArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/res.HttpRes-val_CreateAssignmentInvRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/res.HttpRes-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.HttpRes-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.HttpRes-any'
      security:
      - ApiKeyAuth: []
      summary: Create Assignment Invitation
      tags:
      - assignment-invitation
  /api/v1/assignment-invitations/{invitation_id}:
    delete:
      description: |-
        Delete assignment invitation by id
        The caller must be reviewer of the target chapter
        Auth: `authorization` cookie is preferred over `Authorization` header when both are present
      parameters:
      - description: invitation id
        in: path
        name: invitation_id
        required: true
        type: string
      produces:
