      tags:
      - assignment
  /api/v1/assignments/mine:
    get:
      description: |-
        List assignments of current user
        Auth: `authorization` cookie is preferred over `Authorization` header when both are present
      parameters:
      - collectionFormat: csv
        description: 'include related fields, optional: user, chapter, chapter.comic,
          chapter.comic.workset, chapter.comic.workset.team, chapter.creator, chapter.comic.creator'
        in: query
        items:
          type: string
        name: includes
        type: array
      - description: pagination offset
