  /api/v1/assignments:
    get:
      description: |-
        List assignments for one chapter
        The caller must be reviewer of the target chapter
        Auth: `authorization` cookie is preferred over `Authorization` header when both are present
      parameters:
      - description: chapter id
        in: query
        name: chapter_id
        required: true
        type: string
      - collectionFormat: csv
        description: 'include related fields, optional: user, chapter, chapter.comic,
          chapter.comic.workset, chapter.comic.workset.team, chapter.creator, chapter.comic.creator'
        in: query
        items:
          type: string
        name: includes
        type: array
      - description: pagination offset
        in: query
        name: offset
        type: integer
      - description: pagination limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
