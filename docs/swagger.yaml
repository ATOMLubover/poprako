            $ref: '#/definitions/res.HttpRes-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/res.HttpRes-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.HttpRes-any'
      security:
      - ApiKeyAuth: []
      summary: List My Assignments
      tags:
      - assignment
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login by qid and password and return a `res.HttpRes` wrapper with
