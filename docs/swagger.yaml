        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/res.HttpRes-any'
      security:
      - ApiKeyAuth: []
      summary: List Assignments By Chapter
      tags:
      - assignment
    put:
      consumes:
      - application/json
      description: |-
        Upsert assignment by PUT semantics
        If `role_mask` is zero the request will redirect to delete semantics
        Auth: `authorization` cookie is preferred over `Authorization` header when both are present
      parameters:
      - description: upsert args
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.UpsertAssignmentArgs'
      produces:
