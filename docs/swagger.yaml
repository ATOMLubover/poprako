basePath: /api/v1
definitions:
  model.WorkflowStatus:
    enum:
    - pending
    - in_progress
    - completed
    - unset
    type: string
    x-enum-varnames:
    - WorkflowPending
    - WorkflowInProgress
    - WorkflowCompleted
    - WorkflowUnset
  util.Option-bool:
    type: object
  util.Option-string:
    type: object
  value.AssignmentInfo:
    properties:
      assigned_proofreader_at:
        type: integer
      assigned_publisher_at:
        type: integer
      assigned_raw_provider_at:
        type: integer
      assigned_redrawer_at:
        type: integer
      assigned_reviewer_at:
        type: integer
      assigned_translator_at:
        type: integer
      assigned_typesetter_at:
        type: integer
      chapter:
        $ref: '#/definitions/value.ChapterInfo'
      chapter_id:
        description: 关联的章节信息
        type: string
      created_at:
        type: integer
      id:
        type: string
      updated_at:
        type: integer
      user:
        $ref: '#/definitions/value.UserInfo'
      user_id:
        description: 关联的用户信息
        type: string
    type: object
  value.ChapterInfo:
    properties:
      chapter_no:
        type: string
      comic:
        $ref: '#/definitions/value.ComicInfo'
      comic_id:
        type: string
      created_at:
        type: integer
      creator:
        $ref: '#/definitions/value.UserInfo'
      creator_id:
        type: string
      id:
        type: string
      index:
        type: integer
      page_count:
        type: integer
      proofread_at:
        type: integer
      proofread_unit_count:
        type: integer
      proofreading_at:
        type: integer
      published_at:
        type: integer
      reviewed_at:
        type: integer
      total_unit_count:
        type: integer
      transalating_at:
        type: integer
      translated_at:
        type: integer
      translated_unit_count:
        type: integer
      typeset_at:
        type: integer
      typesetting_at:
        type: integer
      updated_at:
        type: integer
      uploaded_at:
        type: integer
    type: object
  value.ComicInfo:
    properties:
      author:
        type: string
      chapter_count:
        type: integer
      cover_url:
        type: string
      created_at:
        type: integer
      creator:
        $ref: '#/definitions/value.UserInfo'
      creator_id:
        type: string
      description:
        type: string
      id:
        type: string
      index:
        type: integer
      last_active_at:
        type: integer
      title:
        type: string
      updated_at:
        type: integer
      workset:
        $ref: '#/definitions/value.WorksetInfo'
      workset_id:
        type: string
    type: object
  value.CreateChapterArgs:
    properties:
      chapter_no:
        type: string
      comic_id:
        type: string
    type: object
  value.CreateChapterAssignmentArgs:
    properties:
      chapter_id:
        type: string
      role:
        type: integer
      user_id:
        type: string
    type: object
  value.CreateChapterAssignmentResult:
    properties:
      id:
        type: string
    type: object
  value.CreateChapterResult:
    properties:
      id:
        type: string
    type: object
  value.CreateComicArgs:
    properties:
      author:
        type: string
      description:
        type: string
      title:
        type: string
      workset_id:
        type: string
    type: object
  value.CreateComicResult:
    properties:
      id:
        type: string
    type: object
  value.CreateInvitationArgs:
    properties:
      invitee_qq:
        type: string
      roles:
        type: integer
      team_id:
        type: string
    type: object
  value.CreateMemberArgs:
    properties:
      roles:
        type: integer
      team_id:
        type: string
      user_id:
        type: string
    type: object
  value.CreateMemberResult:
    properties:
      member_id:
        type: string
    type: object
  value.CreateTeamArgs:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  value.CreateTeamResult:
    properties:
      id:
        type: string
    type: object
  value.CreateWorksetArgs:
    properties:
      description:
        type: string
      name:
        type: string
      team_id:
        type: string
    type: object
  value.CreateWorksetResult:
    properties:
      id:
        type: string
    type: object
  value.InvitationInfo:
    properties:
      created_at:
        type: integer
      id:
        type: string
      invitation_code:
        type: string
      invitee_qq:
        type: string
      invitor:
        $ref: '#/definitions/value.UserInfo'
      invitor_id:
        type: string
      pending:
        type: boolean
      roles:
        type: integer
    type: object
  value.JoinTeamArgs:
    properties:
      invitation_code:
        type: string
    type: object
  value.LoginUserArgs:
    properties:
      password:
        type: string
      qq:
        type: string
    type: object
  value.LoginUserResult:
    properties:
      access_token:
        type: string
      user_id:
        type: string
    type: object
  value.MemberInfo:
    properties:
      assigned_admin_at:
        type: integer
      assigned_proofreader_at:
        type: integer
      assigned_publisher_at:
        type: integer
      assigned_raw_provider_at:
        type: integer
      assigned_reviewer_at:
        type: integer
      assigned_translator_at:
        type: integer
      assigned_typesetter_at:
        type: integer
      created_at:
        type: integer
      id:
        type: string
      roles:
        type: integer
      team:
        $ref: '#/definitions/value.TeamInfo'
      team_id:
        type: string
      updated_at:
        type: integer
      user:
        $ref: '#/definitions/value.UserInfo'
      user_id:
        type: string
    type: object
  value.PageCreationResult:
    properties:
      page_id:
        type: string
      put_url:
        type: string
    type: object
  value.PageInfo:
    properties:
      chapter_id:
        type: string
      created_at:
        type: integer
      creator:
        $ref: '#/definitions/value.UserInfo'
      creator_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      index:
        type: integer
      proofread_unit_count:
        type: integer
      total_unit_count:
        type: integer
      translated_unit_count:
        type: integer
      updated_at:
        type: integer
    type: object
  value.RegisterUserArgs:
    properties:
      invitation_code:
        type: string
      name:
        type: string
      password:
        type: string
      qq:
        type: string
    type: object
  value.RegisterUserResult:
    properties:
      access_token:
        type: string
      user_id:
        type: string
    type: object
  value.ReserveChapterPagesArgs:
    properties:
      chapter_id:
        type: string
      page_count:
        type: integer
    type: object
  value.ReserveChapterPagesResult:
    properties:
      creations:
        items:
          $ref: '#/definitions/value.PageCreationResult'
        type: array
    type: object
  value.ReserveTeamAvatarResult:
    properties:
      avatar_oss_key:
        type: string
      put_url:
        type: string
    type: object
  value.ReserveUserAvatarResult:
    properties:
      put_url:
        type: string
    type: object
  value.SavePageUnitArgs:
    properties:
      page_id:
        type: string
      unit_diff:
        $ref: '#/definitions/value.UnitDiff'
    type: object
  value.TeamInfo:
    properties:
      avatar_url:
        type: string
      created_at:
        type: integer
      description:
        type: string
      id:
        type: string
      is_avatar_uploaded:
        type: boolean
      name:
        type: string
      updated_at:
        type: integer
    type: object
  value.UnitCreation:
    properties:
      id:
        type: string
      index:
        type: integer
      is_bubble:
        type: boolean
      is_proofread:
        type: boolean
      page_id:
        type: string
      proofread_text:
        type: string
      proofreader_comment:
        type: string
      proofreader_id:
        type: string
      translated_text:
        type: string
      translator_comment:
        type: string
      translator_id:
        type: string
      x_coord:
        type: integer
      y_coord:
        type: integer
    type: object
  value.UnitDiff:
    properties:
      delete:
        description: 仅包含 ID 列表
        items:
          type: string
        type: array
      insert:
        items:
          $ref: '#/definitions/value.UnitCreation'
        type: array
      patch:
        items:
          $ref: '#/definitions/value.UnitPatch'
        type: array
    type: object
  value.UnitInfo:
    properties:
      id:
        type: string
      index:
        type: integer
      is_bubble:
        type: boolean
      is_proofread:
        type: boolean
      page_id:
        type: string
      proofread_text:
        type: string
      proofreader_comment:
        type: string
      proofreader_id:
        type: string
      translated_text:
        type: string
      translator_comment:
        type: string
      translator_id:
        type: string
      x_coord:
        type: integer
      y_coord:
        type: integer
    type: object
  value.UnitPatch:
    properties:
      id:
        type: string
      index:
        type: integer
      is_bubble:
        type: boolean
      is_proofread:
        $ref: '#/definitions/util.Option-bool'
      page_id:
        type: string
      proofread_text:
        $ref: '#/definitions/util.Option-string'
      proofreader_comment:
        $ref: '#/definitions/util.Option-string'
      proofreader_id:
        $ref: '#/definitions/util.Option-string'
      translated_text:
        $ref: '#/definitions/util.Option-string'
      translator_comment:
        $ref: '#/definitions/util.Option-string'
      translator_id:
        $ref: '#/definitions/util.Option-string'
      x_coord:
        type: integer
      y_coord:
        type: integer
    type: object
  value.UpdateAssignmentArgs:
    properties:
      id:
        type: string
      role:
        type: integer
    type: object
  value.UpdateChapterArgs:
    properties:
      chapter_id:
        type: string
      chapter_no:
        description: ChapterNo 章节编号，最多 10 字符；不传则不更新
        type: string
      proofread_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: ProofreadStatus 校对状态，可取值：pending（待校对）、in_progress（校对中）、completed（已校对）；不传则不更新
      publish_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: PublishStatus 发布状态，可取值：pending（待发布）、completed（已发布）；不传则不更新
      review_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: ReviewStatus 审阅状态，可取值：pending（待审阅）、completed（已审阅）；不传则不更新
      translate_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: TranslateStatus 翻译状态，可取值：pending（待翻译）、in_progress（翻译中）、completed（已翻译）；不传则不更新
      typeset_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: TypesetStatus 排版状态，可取值：pending（待排版）、in_progress（排版中）、completed（已排版）；不传则不更新
      upload_status:
        allOf:
        - $ref: '#/definitions/model.WorkflowStatus'
        description: UploadStatus 上传状态，可取值：pending（待上传）、completed（已上传）；不传则不更新
    type: object
  value.UpdateComicArgs:
    properties:
      author:
        type: string
      description:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  value.UpdateInvitationArgs:
    properties:
      id:
        type: string
      roles:
        type: integer
      team_id:
        type: string
    type: object
  value.UpdateMemberRoleArgs:
    properties:
      id:
        type: string
      roles:
        type: integer
    type: object
  value.UpdatePageArgs:
    properties:
      id:
        type: string
      is_uploaded:
        description: |-
          由于采用预签名方式让客户端上传，所以在客户端上传后，
          必须让其主动调用一次更新接口来告诉后端该页面已经上传完成了
        type: boolean
    type: object
  value.UpdateTeamArgs:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  value.UpdateUserArgs:
    properties:
      name:
        type: string
      password:
        type: string
      qq:
        type: string
      user_id:
        type: string
    type: object
  value.UpdateWorksetArgs:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  value.UserInfo:
    properties:
      avatar_url:
        type: string
      created_at:
        type: integer
      id:
        type: string
      is_avatar_uploaded:
        type: boolean
      is_super_admin:
        type: boolean
      name:
        type: string
      qq:
        type: string
      updated_at:
        type: integer
    type: object
  value.WorksetInfo:
    properties:
      comic_count:
        type: integer
      created_at:
        type: integer
      description:
        type: string
      id:
        type: string
      index:
        type: integer
      name:
        type: string
      team:
        $ref: '#/definitions/value.TeamInfo'
      team_id:
        type: string
      updated_at:
        type: integer
    type: object
info:
  contact: {}
  description: LabelPlus Next Web 后端 API 文档
  title: LabelPlus Next Web API
  version: 0.1.0
paths:
  /assignments:
    get:
      description: 获取指定章节的所有分配记录，仅汉化组成员可访问
      parameters:
      - description: 章节 ID
        in: query
        name: chapter_id
        required: true
        type: string
      - collectionFormat: csv
        description: include 关联信息，可选值：user, chapter, chapter.comic, chapter.creator
        in: query
        items:
          type: string
        name: '"includes[]"'
        type: array
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/value.AssignmentInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取章节分配列表
      tags:
      - assignment
    post:
      consumes:
      - application/json
      description: 为指定章节创建一条分配记录，需要当前用户在该章节中拥有 reviewer 角色
      parameters:
      - description: 创建分配参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.CreateChapterAssignmentArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/value.CreateChapterAssignmentResult'
      security:
      - ApiKeyAuth: []
      summary: 创建章节分配
      tags:
      - assignment
  /assignments/{assignment_id}:
    delete:
      description: 删除指定分配记录，需要当前用户在该章节中拥有 reviewer 角色
      parameters:
      - description: 分配 ID
        in: path
        name: assignment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除分配
      tags:
      - assignment
    put:
      consumes:
      - application/json
      description: 全量替换指定分配的角色（PUT 语义），需要当前用户在该章节中拥有 reviewer 角色
      parameters:
      - description: 分配 ID
        in: path
        name: assignment_id
        required: true
        type: string
      - description: 更新分配参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.UpdateAssignmentArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新分配角色
      tags:
      - assignment
  /assignments/mine:
    get:
      description: 获取当前登录用户的所有分配记录，支持分页
      parameters:
      - collectionFormat: csv
        description: include 关联信息，可选值：chapter, chapter.comic, chapter.creator
        in: query
        items:
          type: string
        name: '"includes[]"'
        type: array
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/value.AssignmentInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取我的分配列表
      tags:
      - assignment
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用 QQ 和密码进行登录，成功返回访问令牌
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.LoginUserArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/value.LoginUserResult'
      summary: 用户登录（已测试）
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 使用 QQ、密码、名字和邀请码进行注册，成功返回访问令牌
      parameters:
      - description: 注册参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.RegisterUserArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/value.RegisterUserResult'
      summary: 用户注册（已测试）
      tags:
      - auth
  /chapters:
    get:
      description: 获取指定漫画的章节列表，支持分页和 includes 嵌套信息查询
      parameters:
      - description: 漫画 ID
        in: query
        name: comic_id
        required: true
        type: string
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      - collectionFormat: csv
        description: include 关联信息，可选值：creator
        in: query
        items:
          type: string
        name: '"includes[]"'
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/value.ChapterInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取漫画章节列表
      tags:
      - chapter
    post:
      consumes:
      - application/json
      description: 在指定漫画中创建章节
      parameters:
      - description: 创建章节参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.CreateChapterArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/value.CreateChapterResult'
      security:
      - ApiKeyAuth: []
      summary: 创建漫画章节
      tags:
      - chapter
  /chapters/{chapter_id}:
    delete:
      description: 删除指定章节
      parameters:
      - description: 章节 ID
        in: path
        name: chapter_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除章节
      tags:
      - chapter
    patch:
      consumes:
      - application/json
      description: 局部更新指定章节的信息，未传的字段不会被修改
      parameters:
      - description: 章节 ID
        in: path
        name: chapter_id
        required: true
        type: string
      - description: 更新章节参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.UpdateChapterArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新章节（PATCH 语义，仅传需要更新的字段）
      tags:
      - chapter
  /comics:
    get:
      description: 获取指定工作集的漫画列表，支持分页和 includes 嵌套信息查询
      parameters:
      - description: 工作集 ID
        in: query
        name: workset_id
        required: true
        type: string
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      - collectionFormat: csv
        description: include 关联信息，可选值：workset, creator
        in: query
        items:
          type: string
        name: '"includes[]"'
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/value.ComicInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取指定工作集的漫画列表
      tags:
      - comic
    post:
      consumes:
      - application/json
      description: 在指定汉化组中创建漫画
      parameters:
      - description: 创建漫画参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/value.CreateComicArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/value.CreateComicResult'
      security:
      - ApiKeyAuth: []
      summary: 创建漫画（已测试）
      tags:
      - comic
  /comics/{comic_id}:
    delete:
      description: 删除指定漫画
      parameters:
      - description: 漫画 ID
        in: path
        name: comic_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除漫画（已测试）
      tags:
      - comic
    put:
      consumes:
      - application/json
