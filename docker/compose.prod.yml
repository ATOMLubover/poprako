services:
  prod-postgres:
    image: poprako-s-database:${IMAGE_TAG}
    container_name: prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: poprako
      POSTGRES_USER: poprako
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prod_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poprako -d poprako"]
      interval: 10s
      timeout: 5s
      retries: 5

  prod-db-migrate:
    image: poprako-s-database:${IMAGE_TAG}
    container_name: prod-db-migrate
    depends_on:
      prod-postgres:
        condition: service_healthy
    environment:
      PGHOST: prod-postgres
      PGUSER: poprako
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: poprako
    volumes:
      - ../migrations:/migrations:ro
      - ./prod-database-migrate.sh:/usr/local/bin/prod-database-migrate.sh:ro
    command: ["sh", "/usr/local/bin/prod-database-migrate.sh"]
    restart: "no"

  prod-main-server:
    image: poprako-s-main:${IMAGE_TAG}
    container_name: prod-main-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENVIRONMENT: production
      DATABASE_URL: postgres://poprako:${POSTGRES_PASSWORD}@prod-postgres:5432/poprako?sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OSS_PLATFORM: ${OSS_PLATFORM}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_REGION: ${R2_REGION:-auto}
      R2_CUSTOM_DOMAIN: ${R2_CUSTOM_DOMAIN:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_CUSTOM_DOMAIN: ${ALIYUN_OSS_CUSTOM_DOMAIN}
    depends_on:
      prod-postgres:
        condition: service_healthy

volumes:
  prod_db_data:
    name: poprako_s_prod_db_data
