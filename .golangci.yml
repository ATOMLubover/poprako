version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    # - revive
    - gosec
    - gocritic
    - misspell

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-same-issues: 0

output:
  formats:
    colored-line-number: {}
