services:
  # ── Dev: postgres ────────────────────────────────────────────────────────────
  dev-postgres:
    image: postgres:18-alpine
    container_name: dev-postgres
    profiles: ["db", "app", "setup"]
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: poprako_s_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d poprako_s_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Dev: one-shot migration runner ──────────────────────────────────────────
  dev-database-setup:
    image: postgres:18-alpine
    profiles: ["setup"]
    depends_on:
      dev-postgres:
        condition: service_healthy
    environment:
      PGHOST: dev-postgres
      PGUSER: devuser
      PGPASSWORD: devpassword
      PGDATABASE: poprako_s_db
    volumes:
      - ./migrations:/migrations
      - ./docker/dev-database-setup.sh:/usr/local/bin/dev-database-setup.sh:ro
    command: ["sh", "/usr/local/bin/dev-database-setup.sh"]

  # ── Dev: main-server ─────────────────────────────────────────────────────────────
  dev-main-server:
    build: .
    container_name: dev-main-server
    profiles: ["app"]
    ports:
      - "8080:8080"
    depends_on:
      dev-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://devuser:devpassword@dev-postgres:5432/poprako_s_db?sslmode=disable
      JWT_SECRET_KEY: hardcoded_test_key
    env_file: .env

  # ── Prod: postgres ────────────────────────────────────────────────────────────
  prod-postgres:
    build:
      context: .
      dockerfile: docker/poprako-s-database/Dockerfile
    container_name: prod-postgres
    profiles: ["prod"]
    environment:
      POSTGRES_DB: poprako
      POSTGRES_USER: poprako
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poprako -d poprako"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prod: app ─────────────────────────────────────────────────────────────────
  prod-main-server:
    build:
      context: .
      dockerfile: docker/poprako-s-main/Dockerfile
    container_name: prod-main-server
    profiles: ["prod"]
    ports:
      - "8080:8080"
    environment:
      APP_ENVIRONMENT: production
      DATABASE_URL: postgres://poprako:${POSTGRES_PASSWORD}@prod-postgres:5432/poprako?sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      prod-postgres:
        condition: service_healthy

volumes:
  postgres_data:
  prod_db_data:
