services:
  # ── Dev: postgres ────────────────────────────────────────────────────────────
  dev-postgres:
    image: postgres:18-alpine
    pull_policy: if_not_present
    container_name: dev-postgres
    profiles: ["db", "app", "setup"]
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: db_poprako_s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d db_poprako_s"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Dev: one-shot migration runner ──────────────────────────────────────────
  dev-database-setup:
    image: postgres:18-alpine
    pull_policy: if_not_present
    profiles: ["setup"]
    depends_on:
      dev-postgres:
        condition: service_healthy
    environment:
      PGHOST: dev-postgres
      PGUSER: devuser
      PGPASSWORD: devpassword
      PGDATABASE: db_poprako_s
    volumes:
      - ./migrations:/migrations
      - ./docker/dev-database-setup.sh:/usr/local/bin/dev-database-setup.sh:ro
    command: ["sh", "/usr/local/bin/dev-database-setup.sh"]

  # ── Dev: main-server ─────────────────────────────────────────────────────────────
  dev-main-server:
    build:
      context: .
      pull: false
    pull_policy: if_not_present
    container_name: dev-main-server
    profiles: ["app"]
    ports:
      - "8080:8080"
    depends_on:
      dev-postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_USER: devuser
      DATABASE_PASSWORD: devpassword
      DATABASE_HOST: dev-postgres
      DATABASE_PORT: "5432"
      JWT_SECRET: hardcoded_test_key
      JWT_EXPIRATION_HOURS: "336"
    env_file: .env

  # ── Prod: postgres ────────────────────────────────────────────────────────────
  prod-postgres:
    build:
      context: .
      dockerfile: docker/poprako-s-database/Dockerfile
    container_name: prod-postgres
    profiles: ["prod"]
    environment:
      POSTGRES_DB: db_poprako_s
      POSTGRES_USER: poprako_s
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prod_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poprako_s -d db_poprako_s"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prod: one-shot migration runner (incremental) ───────────────────────────
  prod-db-migrate:
    image: postgres:18-alpine
    pull_policy: if_not_present
    profiles: ["prod"]
    depends_on:
      prod-postgres:
        condition: service_healthy
    environment:
      PGHOST: prod-postgres
      PGUSER: poprako_s
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: db_poprako_s
    volumes:
      - ./migrations:/migrations:ro
      - ./docker/prod-database-migrate.sh:/usr/local/bin/prod-database-migrate.sh:ro
    command: ["sh", "/usr/local/bin/prod-database-migrate.sh"]
    restart: "no"

  # ── Prod: app ─────────────────────────────────────────────────────────────────
  prod-main-server:
    build:
      context: .
      dockerfile: docker/poprako-s-main/Dockerfile
    pull_policy: missing
    container_name: prod-main-server
    profiles: ["prod"]
    ports:
      - "8080:8080"
    environment:
      APP_ENV: prod
      DATABASE_USER: poprako_s
      DATABASE_NAME: db_poprako_s
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST:-prod-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-336}
      OSS_PLATFORM: ${OSS_PLATFORM}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_REGION: ${R2_REGION:-auto}
      R2_CUSTOM_DOMAIN: ${R2_CUSTOM_DOMAIN:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_CUSTOM_DOMAIN: ${ALIYUN_OSS_CUSTOM_DOMAIN}
    depends_on:
      prod-postgres:
        condition: service_healthy

volumes:
  postgres_data:
  prod_db_data:
