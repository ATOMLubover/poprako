basePath: /api/v1
definitions:
  model.WorkflowTransition:
    enum:
    - upload_complete
    - translate_start
    - translate_complete
    - proofread_start
    - proofread_complete
    - typeset_start
    - typeset_complete
    - review_complete
    - publish_complete
    type: string
    x-enum-varnames:
    - WorkflowUploadComplete
    - WorkflowTranslateStart
    - WorkflowTranslateComplete
    - WorkflowProofreadStart
    - WorkflowProofreadComplete
    - WorkflowTypesetStart
    - WorkflowTypesetComplete
    - WorkflowReviewComplete
    - WorkflowPublishComplete
  val.AssignmentInfo:
    properties:
      chapter:
        allOf:
        - $ref: '#/definitions/val.ChapterInfo'
        description: Chapter 是可选的章节信息（仅在 includes 时填充）
      chapter_id:
        description: ChapterID 是所属章节 ID
        type: string
      created_at:
        description: CreatedAt 是记录创建时间的 Unix 毫秒时间戳
        type: integer
      id:
        description: ID 是分配记录的唯一标识
        type: string
      roles:
        description: |-
          Roles 是该分配包含的角色位掩码，各位含义如下：
            bit 0 (1)  = RawProvider（图源）
            bit 1 (2)  = Translator（翻译）
            bit 2 (4)  = Proofreader（校对）
            bit 3 (8)  = Typesetter（嵌字）
            bit 4 (16) = Reviewer（监修）
            bit 5 (32) = Publisher（发布）
        type: integer
      updated_at:
        description: UpdatedAt 是记录最近一次更新时间的 Unix 毫秒时间戳
        type: integer
      user:
        allOf:
        - $ref: '#/definitions/val.UserInfo'
        description: User 是可选的用户信息（仅在 includes 时填充）
      user_id:
        description: UserID 是被分配用户的 ID
        type: string
    type: object
  val.ChapterInfo:
    properties:
      comic:
        allOf:
        - $ref: '#/definitions/val.ComicInfo'
        description: TODO
      comic_id:
        description: ComicID 是所属漫画 ID
        type: string
      created_at:
        description: CreatedAt 是记录创建时间的 Unix 毫秒时间戳
        type: integer
      creator:
        allOf:
        - $ref: '#/definitions/val.UserInfo'
        description: Creator 是可选的创建者信息（仅在 includes 时填充）
      creator_id:
        description: CreatorID 是章节创建者 ID
        type: string
      id:
        description: ID 是章节的唯一标识
        type: string
      index:
        description: Index 是章节在漫画中的序号
        type: integer
      is_pinned:
        description: IsPinned 表示章节是否被顶置
        type: boolean
      page_count:
        description: PageCount 是章节的页面数量
        type: integer
      proofread_at:
        type: integer
      proofread_unit_count:
        description: ProofreadUnitCount 是已校对的单元数量
        type: integer
      proofreading_at:
        type: integer
      published_at:
        type: integer
      reviewed_at:
        type: integer
      subtitle:
        description: Subtitle 是章节副标题
        type: string
      total_unit_count:
        description: TotalUnitCount 是章节的翻译单元总数
        type: integer
      translated_at:
        type: integer
      translated_unit_count:
        description: TranslatedUnitCount 是已翻译的单元数量
        type: integer
      translating_at:
        type: integer
      typeset_at:
        type: integer
      typesetting_at:
        type: integer
      updated_at:
        description: UpdatedAt 是记录最近一次更新时间的 Unix 毫秒时间戳
        type: integer
      uploaded_at:
        description: 工作流时间戳（Unix 毫秒），nil 表示尚未触发
        type: integer
    type: object
  val.ComicInfo:
    properties:
      author:
        description: Author 是漫画作者
        type: string
      chapter_count:
        description: ChapterCount 是漫画下章节数量
        type: integer
      cover_url:
        description: CoverURL 是漫画封面的可访问地址
        type: string
      created_at:
        description: CreatedAt 是记录创建时间的 Unix 毫秒时间戳
        type: integer
      creator:
        allOf:
        - $ref: '#/definitions/val.UserInfo'
        description: Creator 是可选的创建者信息（仅在 includes 时填充）
      creator_id:
        description: CreatorID 是漫画创建者 ID
        type: string
      description:
        description: Description 是漫画描述
        type: string
      id:
        description: ID 是漫画的唯一标识
        type: string
      index:
        description: Index 是漫画在作品集内的序号
        type: integer
      is_cover_uploaded:
        description: IsCoverUploaded 表示封面是否已经上传
        type: boolean
      last_active_at:
        description: LastActiveAt 是最近活跃时间的 Unix 毫秒时间戳
        type: integer
      title:
        description: Title 是漫画标题
        type: string
      updated_at:
        description: UpdatedAt 是记录最近一次更新时间的 Unix 毫秒时间戳
        type: integer
      workset:
        allOf:
        - $ref: '#/definitions/val.WorksetInfo'
        description: Workset 是可选的作品集信息（仅在 includes 时填充）
      workset_id:
        description: WorksetID 是所属作品集 ID
        type: string
    type: object
  val.CreateAssignmentArgs:
    properties:
      chapter_id:
        description: ChapterID 是目标章节 ID
        type: string
      roles:
        description: |-
          Roles 是分配的角色位掩码，各位含义如下：
            bit 0 (1)  = RawProvider（图源）
            bit 1 (2)  = Translator（翻译）
            bit 2 (4)  = Proofreader（校对）
            bit 3 (8)  = Typesetter（嵌字）
            bit 4 (16) = Reviewer（监修）
            bit 5 (32) = Publisher（发布）
        type: integer
      user_id:
        description: UserID 是被分配的用户 ID
        type: string
    required:
    - chapter_id
    - roles
    - user_id
    type: object
  val.CreateAssignmentRes:
    properties:
      id:
        description: ID 是新创建分配记录的标识
        type: string
    type: object
  val.CreateChapterArgs:
    properties:
      comic_id:
        description: ComicID 是目标漫画 ID
        type: string
      subtitle:
        description: Subtitle 是章节副标题（可选）
        type: string
    required:
    - comic_id
    type: object
  val.CreateChapterRes:
    properties:
      id:
        description: ID 是新创建章节的标识
        type: string
    type: object
  val.CreateComicArgs:
    properties:
      author:
        description: Author 是漫画作者
        type: string
      description:
        description: Description 是漫画描述
        type: string
      title:
        description: Title 是漫画标题
        type: string
      workset_id:
        description: WorksetID 是目标作品集 ID
        type: string
    required:
    - author
    - title
    - workset_id
    type: object
  val.CreateComicRes:
    properties:
      id:
        description: ID 是新创建漫画的标识
        type: string
    type: object
  val.CreateInvitationArgs:
    properties:
      invitee_qq:
        description: InviteeQQ 是被邀请者的 QQ 号
        type: string
      roles:
        description: |-
          Roles 是邀请中指定的角色位掩码，各位含义如下：
            bit 0 (1)  = RawProvider（图源）
            bit 1 (2)  = Translator（翻译）
            bit 2 (4)  = Proofreader（校对）
            bit 3 (8)  = Typesetter（嵌字）
            bit 4 (16) = Reviewer（监修）
            bit 5 (32) = Publisher（发布）
            bit 6 (64) = Admin（管理员）
        type: integer
      team_id:
        description: TeamID 是目标汉化组 ID
        type: string
    required:
    - invitee_qq
    - roles
    - team_id
    type: object
  val.CreateMemberArgs:
    properties:
      roles:
        description: |-
          Roles 是分配的角色位掩码，各位含义如下：
            bit 0 (1)  = RawProvider（图源）
            bit 1 (2)  = Translator（翻译）
            bit 2 (4)  = Proofreader（校对）
            bit 3 (8)  = Typesetter（嵌字）
            bit 4 (16) = Reviewer（监修）
            bit 5 (32) = Publisher（发布）
            bit 6 (64) = Admin（管理员）
        type: integer
      team_id:
        description: TeamID 是目标汉化组 ID
        type: string
      user_id:
        description: UserID 是要创建成员的用户 ID
        type: string
    required:
    - roles
    - team_id
    - user_id
    type: object
  val.CreateMemberRes:
    properties:
      id:
        description: ID 是新创建成员记录的标识
        type: string
    type: object
  val.CreateTeamArgs:
    properties:
      description:
        description: Description 是汉化组描述
        type: string
      name:
        description: Name 是汉化组名称
        type: string
    required:
    - name
    type: object
  val.CreateTeamRes:
    properties:
      id:
        description: ID 是新创建汉化组的标识
        type: string
    type: object
  val.CreateWorksetArgs:
    properties:
      description:
        description: Description 是作品集描述（可选）
        type: string
      name:
        description: Name 是作品集名称
        type: string
      team_id:
        description: TeamID 是目标汉化组 ID
        type: string
    required:
    - name
    - team_id
    type: object
  val.CreateWorksetRes:
    properties:
      id:
        description: ID 是新创建作品集的标识
        type: string
    type: object
  val.InvitationInfo:
    properties:
      created_at:
        description: CreatedAt 是记录创建时间的 Unix 毫秒时间戳
        type: integer
      id:
        description: ID 是邀请记录的唯一标识
        type: string
      invitation_code:
        description: InvitationCode 是邀请码
        type: string
      invitee_qq:
        description: InviteeQQ 是被邀请者的 QQ 号
        type: string
      invitor_id:
        description: InvitorID 是邀请发起者的用户 ID
        type: string
      pending:
        description: Pending 表示邀请是否仍有效
        type: boolean
      roles:
        description: |-
          Roles 是邀请中指定的角色位掩码，各位含义如下：
            bit 0 (1)  = RawProvider（图源）
            bit 1 (2)  = Translator（翻译）
            bit 2 (4)  = Proofreader（校对）
            bit 3 (8)  = Typesetter（嵌字）
            bit 4 (16) = Reviewer（监修）
            bit 5 (32) = Publisher（发布）
            bit 6 (64) = Admin（管理员）
        type: integer
      team_id:
        description: TeamID 是目标汉化组 ID
        type: string
    type: object
  val.JoinTeamArgs:
    properties:
      invitation_code:
        description: InvitationCode 是邀请码
        type: string
    required:
    - invitation_code
    type: object
  val.LoginUserArgs:
    properties:
      password:
        description: Pwd 是登录使用的密码
        type: string
      qq:
        description: QQ 是登录使用的 QQ 号
        type: string
    required:
    - password
    - qq
    type: object
  val.LoginUserRes:
    properties:
      access_token:
        description: AccessToken 是用于后续鉴权的访问令牌
        type: string
      user_id:
        description: UserID 是已登录用户的标识
        type: string
    type: object
  val.MemberInfo:
    properties:
      created_at:
        description: CreatedAt 是记录创建时间的 Unix 毫秒时间戳
        type: integer
      id:
        description: ID 是成员记录的唯一标识
        type: string
      roles:
        description: |-
          Roles 是该成员所拥有的角色位掩码，各位含义如下：
            bit 0 (1)  = RawProvider（图源）
            bit 1 (2)  = Translator（翻译）
            bit 2 (4)  = Proofreader（校对）
            bit 3 (8)  = Typesetter（嵌字）
            bit 4 (16) = Reviewer（监修）
            bit 5 (32) = Publisher（发布）
            bit 6 (64) = Admin（管理员）
        type: integer
      team:
        allOf:
        - $ref: '#/definitions/val.TeamInfo'
        description: Team 是可选的汉化组信息（仅在 includes 时填充）
      team_id:
        description: TeamID 是该成员所属的汉化组 ID
        type: string
      updated_at:
        description: UpdatedAt 是记录最近一次更新时间的 Unix 毫秒时间戳
        type: integer
      user:
        allOf:
        - $ref: '#/definitions/val.UserInfo'
        description: User 是可选的用户信息（仅在 includes 时填充）
      user_id:
        description: UserID 是该成员对应的用户 ID
        type: string
    type: object
  val.PageCreationResult:
    properties:
      page_id:
        description: PageID 是新创建页面的标识
        type: string
      put_url:
        description: PutURL 是用于上传的预签名 URL
        type: string
    type: object
  val.PageInfo:
    properties:
      chapter_id:
        description: ChapterID 是所属章节 ID
        type: string
      created_at:
        description: CreatedAt 是记录创建时间的 Unix 毫秒时间戳
        type: integer
      creator:
        allOf:
        - $ref: '#/definitions/val.UserInfo'
        description: Creator 是可选的创建者信息（仅在 includes 时填充）
      creator_id:
        description: CreatorID 是页面创建者 ID
        type: string
      id:
        description: ID 是页面的唯一标识
        type: string
      image_url:
        description: ImageURL 是页面图片的可访问地址
        type: string
      index:
        description: Index 是页面在章节中的序号
        type: integer
      is_uploaded:
        description: IsUploaded 表示图片是否已经上传
        type: boolean
      proofread_unit_count:
        description: ProofreadUnitCount 是已校对的单元数量
        type: integer
      total_unit_count:
        description: TotalUnitCount 是页面的翻译单元总数
        type: integer
      translated_unit_count:
        description: TranslatedUnitCount 是已翻译的单元数量
        type: integer
      updated_at:
        description: UpdatedAt 是记录最近一次更新时间的 Unix 毫秒时间戳
        type: integer
    type: object
  val.RegUserArgs:
    properties:
      invitation_code:
        description: InvCode 是用于注册的邀请代码
        type: string
      name:
        description: Name 是用户注册时设置的显示名称
        type: string
      password:
        description: Pwd 是注册使用的密码
        type: string
      qq:
        description: QQ 是注册使用的 QQ 号
        type: string
    required:
    - invitation_code
    - name
    - password
    - qq
    type: object
  val.RegUserRes:
    properties:
      access_token:
        description: AccessToken 是注册后返回的访问令牌
        type: string
      user_id:
        description: UserID 是新创建用户的标识
        type: string
    type: object
  val.ReserveChapterPagesArgs:
    properties:
      chapter_id:
        description: ChapterID 是目标章节 ID
        type: string
      extension:
        description: Extension 是图片文件扩展名
        type: string
      page_count:
        description: PageCount 是要预留的页面数量
        type: integer
    required:
    - chapter_id
    - extension
    - page_count
    type: object
  val.ReserveChapterPagesRes:
    properties:
      creations:
        description: Creations 是每个页面的创建结果
        items:
          $ref: '#/definitions/val.PageCreationResult'
        type: array
    type: object
  val.ReserveComicCoverArgs:
    properties:
      comic_id:
        description: ComicID 是要上传封面的漫画标识
        type: string
      file_name:
        description: |-
          FileName 是封面文件的原始名称，主要用于 OSS 存储时保留扩展名
          需要携带文件扩展名以便 OSS 正确识别文件类型，例如 "cover.jpg"
        type: string
    required:
    - comic_id
    - file_name
    type: object
  val.ReserveComicCoverRes:
    properties:
      put_url:
        description: PutURL 是用于上传封面的预签名 URL，客户端可以直接使用该 URL 上传封面文件
        type: string
    type: object
  val.ReserveTeamAvatarArgs:
    properties:
      file_name:
        description: |-
          FileName 是汉化组头像文件的原始名称，主要用于 OSS 存储时保留扩展名
          需要携带文件扩展名以便 OSS 正确识别文件类型，例如 "avatar.png"
        type: string
      team_id:
        description: TeamID 是要上传头像的汉化组标识
        type: string
    required:
    - file_name
    - team_id
    type: object
  val.ReserveTeamAvatarRes:
    properties:
      put_url:
        description: PutURL 是用于上传头像的预签名 URL
        type: string
    type: object
  val.ReserveUserAvatarArgs:
    properties:
      file_name:
        description: |-
          FileName 是用户头像文件的原始名称，主要用于 OSS 存储时保留扩展名
          需要携带文件扩展名以便 OSS 正确识别文件类型，例如 "avatar.png"
        type: string
    required:
    - file_name
    type: object
  val.ReserveUserAvatarRes:
    properties:
      put_url:
        description: PutURL 是用于上传头像的预签名 URL，客户端可以直接使用该 URL 上传头像文件
        type: string
    type: object
  val.SavePageUnitArgs:
    properties:
      page_id:
        description: PageID 是目标页面 ID
        type: string
      unit_diff:
        allOf:
        - $ref: '#/definitions/val.UnitDiff'
        description: UnitDiff 是翻译单元的变更信息
    required:
    - page_id
    - unit_diff
    type: object
  val.TeamInfo:
    properties:
      avatar_url:
        description: AvatarURL 是汉化组头像的可访问地址
        type: string
      created_at:
        description: CreatedAt 是记录创建时间的 Unix 毫秒时间戳
        type: integer
      description:
        description: Description 是汉化组的描述
        type: string
      id:
        description: ID 是汉化组的唯一标识
        type: string
      is_avatar_uploaded:
        description: IsAvatarUploaded 表示汉化组是否已上传头像
        type: boolean
      name:
        description: Name 是汉化组的名称
        type: string
      updated_at:
        description: UpdatedAt 是记录最近一次更新时间的 Unix 毫秒时间戳
        type: integer
    type: object
  val.UnitCreation:
    properties:
      id:
        description: ID 是翻译单元的唯一标识
        type: string
      index:
        description: Index 是翻译单元在页面中的序号
        type: integer
      is_bubble:
        description: IsBubble 表示该单元是否是气泡框
        type: boolean
      is_proofread:
        description: IsProofread 表示该单元是否已经校对
        type: boolean
      proofread_text:
        description: ProofreadText 是校对后的文本
        type: string
      proofreader_comment:
        description: ProofreaderComment 是校对者的备注
        type: string
      proofreader_id:
        description: ProofreaderID 是校对者的用户 ID
        type: string
      translated_text:
        description: TranslatedText 是翻译后的文本
        type: string
      translator_comment:
        description: TranslatorComment 是翻译者的备注
        type: string
      translator_id:
        description: TranslatorID 是翻译者的用户 ID
        type: string
      x_coord:
        description: XCoord 是翻译单元的 X 坐标
        type: integer
      y_coord:
        description: YCoord 是翻译单元的 Y 坐标
        type: integer
    required:
    - id
    type: object
  val.UnitDiff:
    properties:
      delete:
        description: Delete 是要删除的翻译单元 ID 列表
        items:
          type: string
        type: array
      insert:
        description: Insert 是要新增的翻译单元列表
        items:
          $ref: '#/definitions/val.UnitCreation'
        type: array
      patch:
        description: Patch 是要修改的翻译单元列表
        items:
          $ref: '#/definitions/val.UnitPatch'
        type: array
    type: object
  val.UnitInfo:
    properties:
      id:
        description: ID 是翻译单元的唯一标识
        type: string
      index:
        description: Index 是翻译单元在页面中的序号
        type: integer
      is_bubble:
        description: IsBubble 表示该单元是否是气泡框
        type: boolean
      is_proofread:
        description: IsProofread 表示该单元是否已经校对
        type: boolean
      page_id:
        description: PageID 是所属页面 ID
        type: string
      proofread_text:
        description: ProofreadText 是校对后的文本
        type: string
      proofreader_comment:
        description: ProofreaderComment 是校对者的备注
        type: string
      proofreader_id:
        description: ProofreaderID 是校对者的用户 ID
        type: string
      translated_text:
        description: TranslatedText 是翻译后的文本
        type: string
      translator_comment:
        description: TranslatorComment 是翻译者的备注
        type: string
      translator_id:
        description: TranslatorID 是翻译者的用户 ID
        type: string
      x_coord:
        description: XCoord 是翻译单元的 X 坐标
        type: integer
      y_coord:
        description: YCoord 是翻译单元的 Y 坐标
        type: integer
    type: object
  val.UnitPatch:
    properties:
      id:
        description: ID 是要修改的翻译单元标识
        type: string
      index:
        description: Index 是翻译单元在页面中的序号
        type: integer
      is_bubble:
        description: IsBubble 表示该单元是否是气泡框
        type: boolean
      is_proofread:
        description: IsProofread 表示该单元是否已经校对
        type: boolean
      proofread_text:
        description: ProofreadText 是校对后的文本
        type: string
      proofreader_comment:
        description: ProofreaderComment 是校对者的备注
        type: string
      proofreader_id:
        description: ProofreaderID 是校对者的用户 ID
        type: string
      translated_text:
        description: TranslatedText 是翻译后的文本
        type: string
      translator_comment:
        description: TranslatorComment 是翻译者的备注
        type: string
      translator_id:
        description: TranslatorID 是翻译者的用户 ID
        type: string
      x_coord:
        description: XCoord 是翻译单元的 X 坐标
        type: integer
      y_coord:
        description: YCoord 是翻译单元的 Y 坐标
        type: integer
    required:
    - id
    type: object
  val.UpdateAssignmentArgs:
    properties:
      id:
        description: ID 是要更新的分配记录标识
        type: string
      roles:
        description: |-
          Roles 是更新后的角色位掩码（PUT 语义全量替换），各位含义如下：
            bit 0 (1)  = RawProvider（图源）
            bit 1 (2)  = Translator（翻译）
            bit 2 (4)  = Proofreader（校对）
            bit 3 (8)  = Typesetter（嵌字）
            bit 4 (16) = Reviewer（监修）
            bit 5 (32) = Publisher（发布）
        type: integer
    required:
    - id
    - roles
    type: object
  val.UpdateChapterArgs:
    properties:
      chapter_id:
        description: ChapterID 是要更新的章节标识
        type: string
      is_pinned:
        description: IsPinned 是更新后的顶置状态（可选）
        type: boolean
      subtitle:
        description: Subtitle 是更新后的副标题（可选）
        type: string
      workflow_transition:
        allOf:
        - $ref: '#/definitions/model.WorkflowTransition'
        description: 工作流转换事件（可选）
    required:
    - chapter_id
    type: object
  val.UpdateComicArgs:
    properties:
      author:
        description: Author 是更新后的作者
        type: string
      description:
        description: Description 是更新后的描述
        type: string
      id:
        description: ID 是要更新的漫画标识
        type: string
      title:
        description: Title 是更新后的标题
        type: string
    required:
    - author
    - id
    - title
    type: object
  val.UpdateInvitationArgs:
    properties:
      id:
        description: ID 是要更新的邀请记录 ID
        type: string
      roles:
        description: |-
          Roles 是更新后的角色位掩码，各位含义如下：
            bit 0 (1)  = RawProvider（图源）
            bit 1 (2)  = Translator（翻译）
            bit 2 (4)  = Proofreader（校对）
            bit 3 (8)  = Typesetter（嵌字）
            bit 4 (16) = Reviewer（监修）
            bit 5 (32) = Publisher（发布）
            bit 6 (64) = Admin（管理员）
        type: integer
      team_id:
        description: TeamID 是目标汉化组 ID，用于鉴权
        type: string
    required:
    - id
    - roles
    - team_id
    type: object
  val.UpdateMemberRoleArgs:
    properties:
      id:
        description: ID 是目标成员记录 ID
        type: string
      roles:
        description: |-
          Roles 是目标角色位掩码（PUT 语义全量替换），各位含义如下：
            bit 0 (1)  = RawProvider（图源）
            bit 1 (2)  = Translator（翻译）
            bit 2 (4)  = Proofreader（校对）
            bit 3 (8)  = Typesetter（嵌字）
            bit 4 (16) = Reviewer（监修）
            bit 5 (32) = Publisher（发布）
            bit 6 (64) = Admin（管理员）
        type: integer
    required:
    - id
    - roles
    type: object
  val.UpdatePageArgs:
    properties:
      id:
        description: ID 是要更新的页面标识
        type: string
      is_uploaded:
        description: IsUploaded 表示是否标记为已上传
        type: boolean
    required:
    - id
    type: object
  val.UpdateTeamArgs:
    properties:
      description:
        description: Description 是更新后的汉化组描述
        type: string
      id:
        description: ID 是要更新的汉化组标识
        type: string
      name:
        description: Name 是更新后的汉化组名称
        type: string
    required:
    - id
    - name
    type: object
  val.UpdateUserArgs:
    properties:
      id:
        description: ID 是要更新的用户标识
        type: string
      name:
        description: Name 表示更新后的显示名称，PUT 语义下为必填
        type: string
      qq:
        description: QQ 表示更新后的 QQ 号，PUT 语义下为必填
        type: string
    required:
    - id
    type: object
  val.UpdateWorksetArgs:
    properties:
      description:
        description: Description 是更新后的描述（可选）
        type: string
      id:
        description: ID 是要更新的作品集标识
        type: string
      name:
        description: Name 是更新后的名称
        type: string
    required:
    - id
    - name
    type: object
  val.UserInfo:
    properties:
      avatar_url:
        description: AvatarURL 是用户头像的可访问地址
        type: string
      created_at:
        description: CreatedAt 是记录创建时间的 Unix 毫秒时间戳
        type: integer
      id:
        description: ID 是用户的唯一标识（例如 UUID 或数据库主键）
        type: string
      is_avatar_uploaded:
        description: IsAvatarUploaded 表示用户是否已上传头像
        type: boolean
      is_super_admin:
        description: IsSuperAdmin 表示用户是否具有超级管理员权限
        type: boolean
      last_login_at:
        description: LastLoginAt 是一个 Unix 毫秒时间戳，表示用户最后一次登录的时间
        type: integer
      name:
        description: Name 是用户的显示名称或昵称
        type: string
      qq:
        description: QQ 是用户的 QQ 号，用于登录或联系方式
        type: string
      updated_at:
        description: UpdatedAt 是记录最近一次更新时间的 Unix 毫秒时间戳
        type: integer
    type: object
  val.UserStatsInfo:
    properties:
      active_assignment_count:
        type: integer
      finished_assignment_count:
        type: integer
      total_assignment_count:
        type: integer
      user_id:
        type: string
    type: object
  val.WorksetInfo:
    properties:
      comic_count:
        description: ComicCount 是作品集中漫画数量
        type: integer
      created_at:
        description: CreatedAt 是记录创建时间的 Unix 毫秒时间戳
        type: integer
      description:
        description: Description 是作品集描述
        type: string
      id:
        description: ID 是作品集的唯一标识
        type: string
      index:
        description: Index 是作品集在汉化组内的序号
        type: integer
      name:
        description: Name 是作品集名称
        type: string
      team:
        allOf:
        - $ref: '#/definitions/val.TeamInfo'
        description: Team 是可选的汉化组信息（仅在 includes 时填充）
      team_id:
        description: TeamID 是所属汉化组 ID
        type: string
      updated_at:
        description: UpdatedAt 是记录最近一次更新时间的 Unix 毫秒时间戳
        type: integer
    type: object
info:
  contact: {}
  description: PopRaKo-S 后端 API 文档
  title: PopRaKo-S API
  version: 0.0.1
paths:
  /assignments:
    get:
      description: 获取指定章节的所有分配记录，仅汉化组成员可访问
      parameters:
      - description: 章节 ID
        in: query
        name: chapter_id
        required: true
        type: string
      - collectionFormat: csv
        description: include 关联信息，可选值：user, chapter, chapter.comic, chapter.creator
        in: query
        items:
          type: string
        name: '"includes[]"'
        type: array
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/val.AssignmentInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取章节分配列表
      tags:
      - assignment
    post:
      consumes:
      - application/json
      description: 为指定章节创建一条分配记录，需要当前用户在该章节中拥有 reviewer 角色
      parameters:
      - description: 创建分配参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.CreateAssignmentArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/val.CreateAssignmentRes'
      security:
      - ApiKeyAuth: []
      summary: 创建章节分配
      tags:
      - assignment
  /assignments/{assignment_id}:
    delete:
      description: 删除指定分配记录，需要当前用户在该章节中拥有 reviewer 角色
      parameters:
      - description: 分配 ID
        in: path
        name: assignment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除分配
      tags:
      - assignment
    put:
      consumes:
      - application/json
      description: 全量替换指定分配的角色（PUT 语义），需要当前用户在该章节中拥有 reviewer 角色
      parameters:
      - description: 分配 ID
        in: path
        name: assignment_id
        required: true
        type: string
      - description: 更新分配参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.UpdateAssignmentArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新分配角色
      tags:
      - assignment
  /assignments/mine:
    get:
      description: 获取当前登录用户的所有分配记录，支持分页
      parameters:
      - collectionFormat: csv
        description: include 关联信息，可选值：chapter, chapter.comic, chapter.creator
        in: query
        items:
          type: string
        name: '"includes[]"'
        type: array
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/val.AssignmentInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取我的分配列表
      tags:
      - assignment
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用 QQ 和密码进行登录，成功返回访问令牌
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.LoginUserArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/val.LoginUserRes'
      summary: 用户登录
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 使用 QQ、密码、名字和邀请码进行注册，成功返回访问令牌
      parameters:
      - description: 注册参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.RegUserArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/val.RegUserRes'
      summary: 用户注册
      tags:
      - auth
  /chapters:
    get:
      description: 获取指定漫画的章节列表，支持分页和 includes 嵌套信息查询
      parameters:
      - description: 漫画 ID
        in: query
        name: comic_id
        required: true
        type: string
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      - collectionFormat: csv
        description: include 关联信息，可选值：creator
        in: query
        items:
          type: string
        name: '"includes[]"'
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/val.ChapterInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取漫画章节列表
      tags:
      - chapter
    post:
      consumes:
      - application/json
      description: 在指定漫画中创建章节，并写入章节副标题
      parameters:
      - description: 创建章节参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.CreateChapterArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/val.CreateChapterRes'
      security:
      - ApiKeyAuth: []
      summary: 创建漫画章节
      tags:
      - chapter
  /chapters/{chapter_id}:
    delete:
      description: 删除指定章节
      parameters:
      - description: 章节 ID
        in: path
        name: chapter_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除章节
      tags:
      - chapter
    patch:
      consumes:
      - application/json
      description: 局部更新指定章节的信息，包括 subtitle 与工作流状态；未传的字段不会被修改；除了 reviewer 以外，其他任何角色都只能修改自己对应的
        workflow 的状态
      parameters:
      - description: 章节 ID
        in: path
        name: chapter_id
        required: true
        type: string
      - description: 更新章节参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.UpdateChapterArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新章节
      tags:
      - chapter
  /comics:
    get:
      description: 获取指定工作集的漫画列表，支持分页，注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 工作集 ID
        in: query
        name: workset_id
        required: true
        type: string
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/val.ComicInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取指定工作集的漫画列表
      tags:
      - comic
    post:
      consumes:
      - application/json
      description: 在指定工作集中创建漫画
      parameters:
      - description: 创建漫画参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.CreateComicArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/val.CreateComicRes'
      security:
      - ApiKeyAuth: []
      summary: 创建漫画
      tags:
      - comic
  /comics/{comic_id}:
    delete:
      description: 删除指定漫画
      parameters:
      - description: 漫画 ID
        in: path
        name: comic_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除漫画
      tags:
      - comic
    put:
      consumes:
      - application/json
      description: 更新指定漫画的信息
      parameters:
      - description: 漫画 ID
        in: path
        name: comic_id
        required: true
        type: string
      - description: 更新漫画参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.UpdateComicArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新漫画
      tags:
      - comic
  /comics/{comic_id}/cover:
    post:
      consumes:
      - application/json
      description: 为指定漫画封面生成预签名 PUT URL，并预留 cover_oss_key
      parameters:
      - description: 漫画 ID
        in: path
        name: comic_id
        required: true
        type: string
      - description: 预留漫画封面参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.ReserveComicCoverArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/val.ReserveComicCoverRes'
      security:
      - ApiKeyAuth: []
      summary: 预留漫画封面上传
      tags:
      - comic
  /comics/{comic_id}/cover/confirm:
    post:
      description: 在客户端上传封面后，确认漫画封面上传状态
      parameters:
      - description: 漫画 ID
        in: path
        name: comic_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 确认漫画封面已上传
      tags:
      - comic
  /invitations:
    get:
      description: 获取指定汉化组的邀请列表，注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 汉化组 ID
        in: query
        name: team_id
        required: true
        type: string
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      - collectionFormat: csv
        description: include 关联信息，可选值：invitor
        in: query
        items:
          type: string
        name: '"includes[]"'
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/val.InvitationInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取邀请列表
      tags:
      - invitation
    post:
      consumes:
      - application/json
      description: 在指定汉化组中创建一个新的邀请
      parameters:
      - description: 创建邀请参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.CreateInvitationArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/val.InvitationInfo'
      security:
      - ApiKeyAuth: []
      summary: 创建邀请
      tags:
      - invitation
  /invitations/{invitation_id}:
    delete:
      description: 删除指定的邀请
      parameters:
      - description: 邀请 ID
        in: path
        name: invitation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 删除邀请
      tags:
      - invitation
    put:
      consumes:
      - application/json
      description: 更新指定待处理邀请的信息，无法更新已被使用或已失效的邀请
      parameters:
      - description: 邀请 ID
        in: path
        name: invitation_id
        required: true
        type: string
      - description: 更新邀请参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.UpdateInvitationArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 更新未被使用的邀请
      tags:
      - invitation
  /members:
    get:
      description: 获取指定汉化组的成员列表，注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 汉化组 ID
        in: query
        name: team_id
        required: true
        type: string
      - collectionFormat: csv
        description: include 关联信息，可选值：user
        in: query
        items:
          type: string
        name: '"includes[]"'
        type: array
      - description: 偏移量
        in: query
        name: offset
        required: true
        type: integer
      - description: 每页数量
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/val.MemberInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: 获取指定汉化组的成员列表
      tags:
      - member
    post:
      consumes:
      - application/json
      description: 由超级管理员直接创建成员记录
      parameters:
      - description: 创建成员参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.CreateMemberArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/val.CreateMemberRes'
      security:
      - ApiKeyAuth: []
      summary: 创建成员
      tags:
      - member
  /members/{member_id}:
    delete:
      description: 从汉化组中移除指定成员
      parameters:
      - description: 成员 ID
        in: path
        name: member_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: 移除成员
      tags:
      - member
    put:
      consumes:
      - application/json
      description: 更新指定成员的分工角色
      parameters:
      - description: 成员 ID
        in: path
        name: member_id
        required: true
        type: string
      - description: 更新成员角色参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/val.UpdateMemberRoleArgs'
      produces:
      - application/json
      responses:
        "200":
